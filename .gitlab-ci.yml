test_pypi_aarch64_910B2_py3.11:
  image: quay.io/ascend/cann:9.0.0-910b-ubuntu22.04-py3.11
  stage: test_aarch64_910B2
  tags:
    - docker_npu_910B2 # Build and test on-device (aarch64 / 910B2)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt
  script:
    - make setup_once
    - pip install pto-kernels
    - python3 -m pytest -v tests/
  when: manual
  allow_failure: true

##################################################
# On-device accuracy tests (one job per test)    #
##################################################
.accuracy_test_x86_910B4:
  image: quay.io/ascend/cann:9.1.0-beta.3-910b-ubuntu22.04-py3.12
  stage: test
  tags:
    - docker_npu # Run accuracy tests on-device NPU (x86-64 / 910B4)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - git submodule update --init --recursive # PTO-ISA is a submodule
    - pip3 install pyyaml setuptools packaging
    - pip3 install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
    - pip3 install torch-npu==2.9.0
    - pip3 install -e .

# accuracy tests (GDN)
test_gdn_single_kernels:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_gdn_single_kernels.py --H-list 16,32,48,64

test_gdn_e2e:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_gdn_e2e.py --no-triton

# accuracy tests (KDA)
test_kda_single_kernels:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_kda_single_kernels.py

test_kda_e2e:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_kda_e2e.py

######################################
# On-device test of examples/jit_cpp #
######################################
test_examples_on_x86_910B4:
  image: quay.io/ascend/cann:9.1.0-beta.3-910b-ubuntu22.04-py3.12
  tags:
    - docker_npu # Build and test on-device NPU (x86-64 / 910B4)
  parallel:
    matrix:
      - EXAMPLE: ["scan", "silu_dynamic"]
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt
  script:
    - echo "Testing example ${EXAMPLE}"
    - make setup_once
    - cd examples/jit_cpp/${EXAMPLE}
    - export PTO_LIB_PATH=${ASCEND_TOOLKIT_HOME}
    - python3 run_${EXAMPLE}.py

