default:
  tags: [cpu]

variables:
  GIT_SUBMODULE_STRATEGY: recursive # PTO-ISA is a submodule

stages:
   - test
   - bench

# Define the workflow rules manually to make sure only a single pipeline
# is created for each MR update. Without that, GitLab creates one pipeline
# for branch update and one for MR update.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

##################################################
# On-device accuracy tests (one job per test)    #
##################################################
.accuracy_test_x86_910B4:
  image: quay.io/ascend/cann:9.1.0-910b-ubuntu22.04-py3.12
  stage: test
  tags:
    - docker_npu # Run accuracy tests on-device NPU (x86-64 / 910B4)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools packaging
    - pip3 install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
    - pip3 install torch-npu==2.9.0
    - pip3 install -e .

# accuracy tests (GDN)
test_gdn_single_kernels:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_gdn_single_kernels.py --H-list 16,32

test_gdn_e2e:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_gdn_e2e.py --no-triton

# accuracy tests (KDA)
test_kda_single_kernels:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_kda_single_kernels.py

test_kda_e2e:
  extends: .accuracy_test_x86_910B4
  script:
    - python3 tests/test_kda_e2e.py

bench_gdn_kernels:
  image: quay.io/ascend/vllm-ascend:v0.23.0rc1
  stage: bench
  tags:
    - docker_npu_910B2 # Build and test on-device (aarch64 / 910B2)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
  script:
    - python benchmarks/kernel/bench_gdn_kernels.py --device npu:0 --n-seq 16 --l-seg 8192 --H-list 16
  when: manual
  allow_failure: true


bench_gdn_kernels_mega_kernel:
  image: quay.io/ascend/vllm-ascend:v0.23.0rc1
  stage: bench
  tags:
    - docker_npu_910B2 # Build and test on-device (aarch64 / 910B2)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
  script:
    - python benchmarks/kernel/bench_gdn_kernels.py --device npu:0 --mega
  when: manual
  allow_failure: true


bench_sglang_mmlu_qwen35_0_8b:
  image: quay.io/ascend/sglang:v0.5.18-cann9.0.0-910b
  stage: bench
  tags:
    - docker_npu_910B2 # Build and test on-device (aarch64 / 910B2)
  variables:
    GDN_USE_MEGA_GDN: "1" # Set to 0 to run the triton kernels instead
    SGLANG_PORT: "30000"
    SGLANG_MODEL: Qwen/Qwen3.5-0.8B
    SGLANG_BENCH_VERSION: v0.5.18
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - curl -fsSL -o bench_sglang.py
      "https://raw.githubusercontent.com/sgl-project/sglang/refs/tags/${SGLANG_BENCH_VERSION}/benchmark/mmlu/bench_sglang.py"
  script:
    # Launch the server in the background and keep its logs as an artifact
    - mkdir -p outputs/logs/
    - python -m sglang.launch_server --model-path "$SGLANG_MODEL" --port "$SGLANG_PORT"
      > outputs/logs/sglang_server.log 2>&1 &
    - echo $! > sglang_server.pid
    # Wait for the server to be up (fail fast if it dies or never becomes healthy)
    - |
      for i in $(seq 1 120); do
        if ! kill -0 "$(cat sglang_server.pid)" 2>/dev/null; then
          echo "sglang server exited before becoming healthy"
          tail -n 100 outputs/logs/sglang_server.log
          exit 1
        fi
        if curl -fsS "http://127.0.0.1:${SGLANG_PORT}/health_generate" >/dev/null 2>&1; then
          echo "sglang server is up after ${i} attempt(s)"
          break
        fi
        if [ "$i" -eq 120 ]; then
          echo "timed out waiting for the sglang server on port ${SGLANG_PORT}"
          tail -n 100 outputs/logs/sglang_server.log
          exit 1
        fi
        sleep 5
      done
    # Test megaGDN-pto kernel
    - python3 bench_sglang.py --nsub 10
  after_script:
    - if [ -f sglang_server.pid ]; then kill "$(cat sglang_server.pid)" 2>/dev/null || true; fi
  when: manual
  allow_failure: true
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - outputs/logs/

bench_lm_eval_qwen35_0_8b:
  image: quay.io/ascend/vllm-ascend:v0.23.0rc1
  stage: bench
  tags:
    - docker_npu_910B2 # Build and test on-device (aarch64 / 910B2)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
  script:
    - pip install -U lm-eval
    - mkdir -p outputs/data/eval/
    - python benchmarks/eval_acc/run_lm_eval.py --preset qwen35_0_8b --output-json outputs/data/eval/qwen35_0_8b_pto.json
  when: manual
  allow_failure: true
  artifacts:
    expire_in: 1 day
    paths:
      - outputs/data/
